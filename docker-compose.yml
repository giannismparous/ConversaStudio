services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dialogos-forge-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: dialogos_forge
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d dialogos_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forge_pgdata:
