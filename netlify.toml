[build]
  command = "npm ci && npm run build -w @dialogos-forge/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE = "/dialogos/"
  VITE_FLOW_ORIGIN = "https://simasiaai-flow.netlify.app"

# Shared SimasiaAI theme lives on fλow; proxy when Dialogos is hit directly.
[[redirects]]
  from = "/theme/*"
  to = "https://simasiaai-flow.netlify.app/theme/:splat"
  status = 200
  force = true

# Served under fλow at /dialogos/ (Vite base). Map path back to publish root.
[[redirects]]
  from = "/dialogos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dialogos/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dialogos/*"
  to = "/:splat"
  status = 200

# Bare site root → fλow (product lives under the shell).
[[redirects]]
  from = "/"
  to = "https://simasiaai-flow.netlify.app/"
  status = 302
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow fλow (HermesView team) to iframe this site. Same-origin Netlify proxy
# across teams 500s, so the shell embeds conversastudio.netlify.app cross-origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "frame-ancestors 'self' https://simasiaai-flow.netlify.app https://*.netlify.app"
    Referrer-Policy = "no-referrer"
